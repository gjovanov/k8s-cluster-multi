---
# ============================================================
# Environment-driven configuration (from .env)
# ============================================================
host_user: "{{ lookup('env', 'HOST_USER') | default('deployer', true) }}"
home_dir: "{{ lookup('env', 'HOME_DIR') | default('/home/' + host_user, true) }}"

# ============================================================
# Host definitions (bare-metal servers)
# ============================================================
bare_metal_hosts:
  mars:
    public_ip: "{{ lookup('env', 'MARS_PUBLIC_IP') | default('198.51.100.10', true) }}"
    wg_ip: "10.10.0.1"
    vm_subnet: "10.10.10.0/24"
    vm_gateway: "10.10.10.1"
    vm_bridge: "virbr1"
    interface: "{{ lookup('env', 'MARS_INTERFACE') | default('eth0', true) }}"
  zeus:
    public_ip: "{{ lookup('env', 'ZEUS_PUBLIC_IP') | default('198.51.100.20', true) }}"
    wg_ip: "10.10.0.2"
    vm_subnet: "10.10.20.0/24"
    vm_gateway: "10.10.20.1"
    vm_bridge: "virbr1"
    interface: "{{ lookup('env', 'ZEUS_INTERFACE') | default('enp5s0', true) }}"
  jupiter:
    public_ip: "{{ lookup('env', 'JUPITER_PUBLIC_IP') | default('198.51.100.30', true) }}"
    wg_ip: "10.10.0.3"
    vm_subnet: "10.10.30.0/24"
    vm_gateway: "10.10.30.1"
    vm_bridge: "virbr1"
    interface: "{{ lookup('env', 'JUPITER_INTERFACE') | default('enp5s0', true) }}"

# ============================================================
# WireGuard
# ============================================================
wg_port: 51820
wg_interface: "wg0"

# ============================================================
# Libvirt NAT network (per host, same name, unique subnet)
# ============================================================
libvirt_network_name: "k8s-net"
libvirt_domain: "k8s.local"
libvirt_dhcp_start_offset: 10
libvirt_dhcp_end_offset: 50

# ============================================================
# VM definitions
# ============================================================
vms:
  - name: k8s-master-1
    ip: "10.10.10.10"
    mac: "52:54:00:0a:01:10"
    host: mars
    vcpu: 2
    memory: 8192
    disk_gb: 40
    role: master
    tags:
      - master
      - master-main
  - name: k8s-worker-1
    ip: "10.10.10.11"
    mac: "52:54:00:0a:01:11"
    host: mars
    vcpu: 4
    memory: 32768
    disk_gb: 100
    role: worker
    tags:
      - worker
      - worker-mini
  - name: k8s-master-2
    ip: "10.10.20.10"
    mac: "52:54:00:0a:02:10"
    host: zeus
    vcpu: 2
    memory: 8192
    disk_gb: 40
    role: master
    tags:
      - master
  - name: k8s-worker-2
    ip: "10.10.20.11"
    mac: "52:54:00:0a:02:11"
    host: zeus
    vcpu: 12
    memory: 98304
    disk_gb: 200
    role: worker
    tags:
      - worker
      - worker-large
  - name: k8s-master-3
    ip: "10.10.30.10"
    mac: "52:54:00:0a:03:10"
    host: jupiter
    vcpu: 2
    memory: 8192
    disk_gb: 40
    role: master
    tags:
      - master
  - name: k8s-worker-3
    ip: "10.10.30.11"
    mac: "52:54:00:0a:03:11"
    host: jupiter
    vcpu: 12
    memory: 98304
    disk_gb: 200
    role: worker
    tags:
      - worker
      - worker-large

# ============================================================
# Cloud image
# ============================================================
cloud_image_url: "https://cloud-images.ubuntu.com/jammy/current/jammy-server-cloudimg-amd64.img"
cloud_image_name: "jammy-server-cloudimg-amd64.img"
cloud_image_dir: "/var/lib/libvirt/images"
vm_image_dir: "/var/lib/libvirt/images"

# ============================================================
# vmtest — throwaway install-test VMs (FR-61, roomler-ai#1199)
# ============================================================
# Host capability for the on-demand install & verify matrix. VM LIFECYCLE is
# owned by roomler-ai-deploy/vmtest/vmtest.sh, NOT by ansible — nothing here
# creates a VM. Deliberately a separate network + separate storage dir so the
# k8s VMs (and the "never touch /var/lib/libvirt/images" rule) stay untouched.
# vmtest VMs must NEVER be added to the `vms:` list above — vm-provision would
# pick them up and phases 6-9 would try to make kubelets out of them.
vmtest_net_name: "vmtest-net"
vmtest_domain: "vmtest.local"
vmtest_dir: "/var/lib/libvirt/vmtest"
vmtest_hosts:
  mars:
    subnet: "10.10.110.0/24"
    gateway: "10.10.110.1"
    bridge: "virbr2"
  zeus:
    subnet: "10.10.120.0/24"
    gateway: "10.10.120.1"
    bridge: "virbr2"
  jupiter:
    subnet: "10.10.130.0/24"
    gateway: "10.10.130.1"
    bridge: "virbr2"
# Golden-image source material cached by the role (fetch skipped when present).
vmtest_noble_amd64_url: "https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img"
vmtest_noble_arm64_url: "https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-arm64.img"
vmtest_virtio_win_url: "https://fedorapeople.org/groups/virt/virtio-win/direct-downloads/stable-virtio/virtio-win.iso"
# Windows 11 Enterprise Evaluation (90-day). Use Microsoft's STABLE fwlink
# redirect (get_url follows it) rather than the raw Azure blob, which rotates
# every build — the fwlink resolves to the current 25H2 eval ISO. Overridable
# via .env (VMTEST_WIN11_ISO_URL); if it ever breaks, grab a fresh link from
# https://www.microsoft.com/evalcenter/download-windows-11-enterprise or place
# the ISO at {{ vmtest_dir }}/iso/win11-eval.iso by hand.
vmtest_win11_iso_url: "{{ lookup('env', 'VMTEST_WIN11_ISO_URL') | default('https://go.microsoft.com/fwlink/?linkid=2334167&clcid=0x409&culture=en-us&country=us', true) }}"
vmtest_fetch_win11_iso: true
# Free disk (GiB) required on the filesystem holding vmtest_dir before the
# role will proceed — golden images + overlays + two ISOs fit in well under
# this; the margin protects the shared md2 root (mars filled / mid-deploy on
# 2026-07-12).
vmtest_min_free_gb: 80

# ============================================================
# Kubernetes
# ============================================================
k8s_version: "1.31"
k8s_apt_key_url: "https://pkgs.k8s.io/core:/stable:/v1.31/deb/Release.key"
k8s_apt_repo: "https://pkgs.k8s.io/core:/stable:/v1.31/deb/"
k8s_pod_cidr: "10.244.0.0/16"
k8s_service_cidr: "10.96.0.0/12"
k8s_control_plane_endpoint: "127.0.0.1:8443"
k8s_first_master: "k8s-master-1"
k8s_first_master_ip: "10.10.10.10"

k8s_master_ips:
  - "10.10.10.10"
  - "10.10.20.10"
  - "10.10.30.10"

# ============================================================
# Containerd
# ============================================================
containerd_version: "1.7.*"

# ============================================================
# Cilium CNI
# ============================================================
cilium_version: "1.16.5"
cilium_helm_repo: "https://helm.cilium.io"
cilium_mtu: 1370
cilium_operator_replicas: 2

# ============================================================
# HAProxy (local API server load balancer on every node)
# ============================================================
haproxy_frontend_port: 8443
haproxy_backend_port: 6443

# ============================================================
# COTURN
# ============================================================
coturn_realm: "{{ lookup('env', 'COTURN_REALM') | default('example.com', true) }}"
coturn_auth_secret: "{{ lookup('env', 'COTURN_AUTH_SECRET') }}"
# Pinned by DIGEST, not a tag. `:latest` meant every pod restart re-pulled
# whatever upstream had published that day, so the TURN fleet could silently
# change version underneath a live mesh — and a coturn regression is exactly
# the kind of fault that presents as "the overlay is slow" days later. This
# digest is the image the fleet was ALREADY running when it was pinned
# (2026-08-07), so adopting it changes nothing; it only stops the drift.
# To upgrade: pull the new tag, read its digest, put it here, apply ONE
# worker at a time — applying this restarts TURN.
coturn_image: "coturn/coturn@sha256:7df59bcd84800c3978da2dd0d7fb17a8179e77a8bf667f678813120a9f18b094"
coturn_turn_port: 3478
coturn_turns_port: 5349
coturn_alt_tls_port: 443
coturn_min_port: 10000
coturn_max_port: 13000
coturn_namespace: "coturn"
coturn_tls_cert: "{{ lookup('env', 'COTURN_TLS_CERT') | default(home_dir + '/cert/example.com.fullchain.pem', true) }}"
coturn_tls_key: "{{ lookup('env', 'COTURN_TLS_KEY') | default(home_dir + '/cert/example.com.key.pem', true) }}"

coturn_workers:
  - name: coturn-worker-1
    node: k8s-worker-1
    node_ip: "10.10.10.11"
    # Mars-only override: bare_metal_hosts.mars.public_ip is the
    # primary 94.130.141.98 owned by the host nginx (port 443
    # conflict). coturn.roomler.ai DNS publishes the secondary
    # 94.130.141.74, and the iptables DNAT in coturn_dnat_rules
    # routes that secondary to this pod. Coturn external-ip MUST
    # match what clients dial (DNS) so relay candidates are
    # reachable. Source-of-truth for the secondary IP lives in
    # coturn_dnat_rules.mars.secondary_ip - referenced here to
    # keep the two in lockstep.
    public_ip: "{{ coturn_dnat_rules.mars.secondary_ip }}"
    host: mars
  - name: coturn-worker-2
    node: k8s-worker-2
    node_ip: "10.10.20.11"
    public_ip: "{{ bare_metal_hosts.zeus.public_ip }}"
    host: zeus
  - name: coturn-worker-3
    node: k8s-worker-3
    node_ip: "10.10.30.11"
    public_ip: "{{ bare_metal_hosts.jupiter.public_ip }}"
    host: jupiter

# Per-host COTURN iptables DNAT rules
coturn_dnat_rules:
  mars:
    public_ip: "{{ bare_metal_hosts.mars.public_ip }}"
    secondary_ip: "94.130.141.74"
    dest_ip: "10.10.10.11"
    vm_subnet: "10.10.10.0/24"
    protocols: [tcp, udp]
    ports: [3478, 5349]
    port_ranges: ["10000:13000"]
    # Mars primary_ip :443 is owned by the host nginx container; only the
    # secondary IP can serve TURNS-over-:443 (redirected to coturn :5349).
    secondary_redirects:
      - { proto: tcp, dport: 443, tport: 5349 }
      - { proto: udp, dport: 443, tport: 3478 }
  zeus:
    public_ip: "{{ bare_metal_hosts.zeus.public_ip }}"
    dest_ip: "10.10.20.11"
    vm_subnet: "10.10.20.0/24"
    protocols: [tcp, udp]
    ports: [3478, 5349]
    port_ranges: ["10000:13000", "40000:49999"]  # COTURN relay + mediasoup RTC (worker-2 hosts a roomler-ai pod since S6 — omitting the RTC range here was the 2026-08-26 no-video incident)
    # Zeus has no nginx on :443; primary_ip can serve TURNS-over-:443 directly.
    primary_redirects:
      - { proto: tcp, dport: 443, tport: 5349 }
      - { proto: udp, dport: 443, tport: 3478 }
  jupiter:
    public_ip: "{{ bare_metal_hosts.jupiter.public_ip }}"
    dest_ip: "10.10.30.11"
    vm_subnet: "10.10.30.0/24"
    protocols: [tcp, udp]
    ports: [3478, 5349]
    port_ranges: ["10000:13000", "40000:49999"]  # COTURN relay + mediasoup RTC
    primary_redirects:
      - { proto: tcp, dport: 443, tport: 5349 }
      - { proto: udp, dport: 443, tport: 3478 }

# ============================================================
# Host firewall — default-deny INPUT/FORWARD, per-host allow-list.
# Coordinated with `coturn_dnat_rules` above (PREROUTING DNAT runs before
# the FORWARD chain — the host-firewall role's HOST_FW_FORWARD chain decides
# whether to ACCEPT or DROP the DNAT'd traffic).
# ============================================================
host_firewall_wg_peers:
  - "{{ bare_metal_hosts.mars.public_ip }}"
  - "{{ bare_metal_hosts.zeus.public_ip }}"
  - "{{ bare_metal_hosts.jupiter.public_ip }}"

host_firewall_wg_peer_subnets:
  - "10.10.0.0/24"   # WG endpoint subnet (mars=10.10.0.1, zeus=10.10.0.2, jupiter=10.10.0.3) — outbound from a host's bare-metal nginx/turnserver crossing the WG mesh appears as source 10.10.0.X
  - "10.10.10.0/24"  # mars VMs
  - "10.10.20.0/24"  # zeus VMs
  - "10.10.30.0/24"  # jupiter VMs

# Per-host overrides applied via host_vars/{mars,zeus,jupiter}.yml
# (see those files for host_firewall_allowed_tcp / _udp / _vm_subnet / _vm_dest_ip).

# ============================================================
# SNI Proxy (mars only)
# ============================================================
sni_proxy_hostname: "{{ lookup('env', 'SNI_PROXY_HOSTNAME') | default('coturn.example.com', true) }}"
sni_proxy_listen_port: 4443
sni_proxy_public_ip: "{{ bare_metal_hosts.mars.public_ip }}"
sni_proxy_backend_ip: "10.10.10.11"
sni_proxy_docker_container: "{{ lookup('env', 'SNI_PROXY_DOCKER_CONTAINER') | default('nginx', true) }}"

# ============================================================
# Monitoring
# ============================================================
monitoring_namespace: "monitoring"
monitoring_helm_release: "kube-prom"
monitoring_helm_chart_version: "65.1.0"
grafana_admin_password: "{{ lookup('env', 'GRAFANA_ADMIN_PASSWORD') }}"
alertmanager_smtp_host: "smtp.sendgrid.net:587"
alertmanager_smtp_from: "{{ lookup('env', 'ALERTMANAGER_EMAIL_FROM') | default('alerts@example.com', true) }}"
alertmanager_smtp_to: "{{ lookup('env', 'ALERTMANAGER_EMAIL_TO') | default('admin@example.com', true) }}"
alertmanager_smtp_user: "{{ lookup('env', 'SMTP_USER') }}"
alertmanager_smtp_password: "{{ lookup('env', 'SMTP_PASSWORD') }}"
prometheus_retention: "14d"
prometheus_storage_size: "10Gi"
prometheus_memory_limit: "1Gi"

# ============================================================
# Paths (derived from home_dir)
# ============================================================
project_dir: "{{ home_dir }}/k8s-cluster-multi"
kubeconfig_local_path: "{{ home_dir }}/k8s-cluster-multi/files/kubeconfig"
iptables_backup_path: "{{ home_dir }}/k8s-cluster-multi/backup/iptables-backup.rules"
