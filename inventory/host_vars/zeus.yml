---
# Zeus (5.9.157.226) — host firewall allow-list.
#
# Zeus hosts a roomler-ai pod (worker-2) since S6 — mediasoup RTC range
# 40000-49999 must be forwarded (see coturn_dnat_rules + host_firewall_mediasoup_rtc).
# Zeus runs no public-facing host services beyond SSH + WireGuard. All
# user-facing traffic (lgr, tickytack, purestat, bauleiter, regal, lgr-mongo,
# coturn-on-zeus) is served by VMs reached via libvirt+iptables DNAT.
#
# roomlerd (the Roomler mesh node on this host) pins overlay_direct_port = 21640
# in /etc/roomler/config.toml: its default port band (43648-44415) sits INSIDE
# the RTC range DNAT'd to the VM, so a peer's first packet to it went into the VM
# and the host fell off direct paths after every re-handshake (roomler-ai#1665).
# The pinned footprint is 21640-22415 (base, +256 public twin, +512 fallback
# band) — below the kernel's ephemeral range, clear of every DNAT here.
host_firewall_allowed_tcp:
  - 3478
  - 5349
host_firewall_allowed_udp:
  - 3478
  - 5349
  - 51820
  - "21640:22415"  # roomlerd overlay (pinned; see header, roomler-ai#1665)

host_firewall_vm_subnet: "10.10.20.0/24"
host_firewall_vm_dest_ip: "10.10.20.11"
host_firewall_mediasoup_rtc: true

host_hardening_expected_tcp:
  - 22         # sshd
  - 53         # libvirt dnsmasq + systemd-resolve (loopback only)
  - 4433       # legacy oxmux-agent QUIC stray
  - 8443       # haproxy K8s API LB (loopback only)
  - 9100       # node-exporter (only via WG mesh)
host_hardening_expected_udp:
  - 53         # dnsmasq + systemd-resolve
  - 67         # libvirt dnsmasq DHCP server for the VM subnet
  - 4433       # legacy stray
  - 51820      # WireGuard
  - 21640      # roomlerd overlay direct port (pinned, roomler-ai#1665)
  - 21896      # roomlerd overlay public-dial twin (21640 + 256)
  # libvirt dnsmasq picks ephemeral high UDP ports for upstream queries; we
  # do NOT allow-list ephemeral ranges. The drift alert tolerates short bursts.

