---
# Mars (94.130.141.98 + 94.130.141.74) — host firewall allow-list.
#
# Mars is the front-of-house: hosts the docker nginx container (for all web
# apps), Docker Registry v2, ArgoCD reverse-proxy, ClawUI, NanoClaw, asterisk,
# audio-waveform, oxmux-agent, plus the mars-side coturn TURN server.
host_firewall_allowed_tcp:
  - 80           # HTTP (nginx redirects to 443)
  - 443          # HTTPS (nginx — roomler.ai/lgrai.app/oxmux.app/argocd.roomler.ai/registry.roomler.ai/etc.)
  - 3478         # COTURN (also DNAT'd to worker-1)
  - 5349         # TURNS
host_firewall_allowed_udp:
  - 80           # HTTP/3 unlikely on 80, but kept symmetric
  - 443          # HTTP/3 (QUIC)
  - 3478         # TURN/STUN UDP
  - 5349         # DTLS / alt
  - 51820        # WireGuard (also matched by host_firewall_wg_peers)
  # roomlerd overlay: the derived port band (43648-43903), its +256 public twin
  # and the +512 fallback band. Mars serves no mediasoup, so nothing DNATs
  # this band and roomlerd keeps its default port here. Allowed by hand on
  # 2026-08-15 (as 43648:44200) but never recorded here, so re-rendering the
  # firewall would have taken mars off direct paths (roomler-ai#1665).
  - "43648:44415"

# COTURN port range for mars (10000-13000)
host_firewall_vm_subnet: "10.10.10.0/24"
host_firewall_vm_dest_ip: "10.10.10.11"
host_firewall_mediasoup_rtc: false

# host_hardening — what legitimately listens on this host. Every ten minutes
# `listening-ports-audit.sh` compares the real listeners with these lists and writes a metric
# line for each one that is not here; UnexpectedListenerOnNode fires when such a listener is
# reachable from another machine and two runs in a row have seen it. An entry is a port or a
# "low:high" range. A listener bound to loopback only is recorded but never mailed, so those
# entries exist to keep the count at zero, not to silence an alert.
host_hardening_expected_tcp:
  - 22       # sshd
  - 53       # dnsmasq (VM bridges) + systemd-resolve (loopback only)
  - 80       # nginx (host docker)
  - 443      # nginx (host docker)
  - 3000     # node
  - 3080     # bun
  - 3333     # bun
  - 3478     # turnserver (host) + COTURN_DNAT for VM coturn
  - 4099     # bun
  - 4200     # bun (clawui), loopback only
  - 5000     # docker-proxy (roomler-registry — bound to 127.0.0.1)
  - 5349     # turnserver (host) + COTURN_DNAT for VM coturn
  - 8443     # haproxy K8s API LB (loopback only)
  - 9000     # docker-proxy (roomler-ai-minio-1)
  - 9001     # docker-proxy (roomler-ai-minio-1 console)
  - 9100     # host metrics collector (tunnel address only)
  - 47989    # roomlerd (loopback only)
  - "5900:5963"  # consoles of the throwaway test guests (loopback only)
  # Published container ports. This list does NOT make a published port reachable or closed (it
  # is forwarded to its container, never delivered to the host's INPUT chain);
  # published-port-guard, below, is what closes them to the public interface. Publishing on
  # 127.0.0.1 is still the cleanup:
  - 6379     # docker-proxy (a test database)
  - 27019    # docker-proxy (a test database)
host_hardening_expected_udp:
  - 53       # dnsmasq + systemd-resolve + roomlerd (overlay addresses)
  - 67       # libvirt dnsmasq DHCP
  - 80
  - 443      # QUIC
  - 3478
  - 4433     # oxmux-agent QUIC
  - 5349
  - 51820    # wireguard
  - "43648:44415"  # roomlerd overlay: the band host_firewall_allowed_udp opens, see above
# Processes that also send from a random port. Their sockets inside the kernel's ephemeral range
# are expected; the same process on any other port is not.
host_hardening_expected_udp_ephemeral:
  - dnsmasq      # upstream queries
  - roomlerd     # NAT traversal
  - oxmux-agent  # QUIC client side

# published-port-guard (phase 18) — mars runs containers next to the cluster, and none of the
# ports they publish is meant for the internet: published_port_guard_open_tcp / _udp stay empty,
# so every published port is closed to the public interface, whichever container publishes it
# next. The list below is for the second path only (the listener each published port has on the
# host, which is what IPv6 reaches): keep it in step with `docker ps`.
published_port_guard_host_tcp:
  - 6379     # docker-proxy
  - 27019    # docker-proxy

