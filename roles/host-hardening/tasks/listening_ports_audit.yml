---
# Port allow-list audit. Every ten minutes a script compares what listens on the host with the
# lists in inventory/host_vars/<host>.yml (host_hardening_expected_tcp, _udp and _udp_ephemeral)
# and writes the result as a metric file. host_metrics.yml installs the collector that serves the
# file to the cluster's Prometheus, where the alert UnexpectedListenerOnNode reads it.
#
# The script's rules are pinned by roles/host-hardening/tests/listening-ports-audit.test.sh.

# A mistyped entry stops the run here. On the host it would cover nothing, or more than was meant.
- name: Check the form of every list entry
  ansible.builtin.assert:
    that:
      - lpa_bad_entries | length == 0
    fail_msg: "not a port, a low:high range, or one of those followed by @process: {{ lpa_bad_entries | join(', ') }}"
    quiet: true
  vars:
    lpa_bad_entries: >-
      {{ ((host_hardening_expected_tcp | default([])) + (host_hardening_expected_udp | default([])))
         | map('string') | reject('match', '^[0-9]+(:[0-9]+)?(@[A-Za-z0-9._:@+-]+)?$') | list }}

- name: Install the port audit script
  ansible.builtin.template:
    src: listening-ports-audit.sh.j2
    dest: /usr/local/bin/listening-ports-audit.sh
    owner: root
    group: root
    mode: "0755"

- name: Ensure the metric file directory exists
  ansible.builtin.file:
    path: /var/lib/node_exporter/textfile_collector
    state: directory
    owner: root
    group: root
    mode: "0755"

# Ten minutes, not once a day: the alert waits fifteen minutes before it fires, and a listener
# that came and went in between is no finding.
- name: Schedule the port audit (cron, every ten minutes)
  ansible.builtin.cron:
    name: listening-ports-audit
    user: root
    minute: "*/10"
    hour: "*"
    job: "/usr/local/bin/listening-ports-audit.sh > /var/log/listening-ports-audit.log 2>&1"

- name: Run the audit now
  ansible.builtin.command: /usr/local/bin/listening-ports-audit.sh
  register: lp_audit
  changed_when: false
  failed_when: false

- name: What the audit says
  ansible.builtin.debug:
    msg: "{{ (lp_audit.stdout | default('')) ~ ' ' ~ (lp_audit.stderr | default('')) }}"
  when: not ansible_check_mode
